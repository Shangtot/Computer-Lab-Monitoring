<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Lab Monitoring</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <h1>Computer Lab Monitoring</h1>
      <p>School laboratory dashboard</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="admin" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="Admin123!" required />

        <button type="submit">Login</button>
      </form>
      <div id="loginMessage" class="status"></div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
